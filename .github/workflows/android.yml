name: Tsuzuri Android — strict quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsuzuri-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source and security policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Security-critical source contract
        run: python3 tools/ci/verify_source_contract.py

  secret-scan:
    name: Secret leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Kotlin compile, lint, tests, debug APK
    needs: [source-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Configure Gradle and verify wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Configure CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - name: Kotlin/Android static checks and compilation
        run: ./gradlew :app:lintDebug :lib:prediction:test :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --warning-mode=all
      - name: Upload debug builds
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: tsuzuri-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error

  merge-gate:
    name: Tsuzuri merge gate
    if: always()
    needs: [source-contract, secret-scan, android]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every mandatory job succeeded
        env:
          SOURCE: ${{ needs.source-contract.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          test "$SOURCE" = 'success'
          test "$SECRETS" = 'success'
          test "$ANDROID" = 'success'
          echo 'All automated Tsuzuri checks passed. External Codex/security review and manual device testing remain separate requirements.'
