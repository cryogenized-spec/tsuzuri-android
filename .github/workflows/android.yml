name: Tsuzuri Android — strict quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsuzuri-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source and security policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Security-critical source contract
        run: python3 tools/ci/verify_source_contract.py

  secret-scan:
    name: Secret leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Kotlin compile, lint, tests, debug APK
    needs: [source-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Configure Gradle and verify wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Configure CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - name: Kotlin/Android static checks and compilation
        run: ./gradlew :app:lintDebug :lib:prediction:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon --warning-mode=all
      - name: Upload debug builds
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: tsuzuri-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error

  android-instrumentation:
    name: Android clipboard privacy tests
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android privacy integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.patrickgold.florisboard.TsuzuriClipboardSecurityTest --stacktrace --no-daemon
      - name: Upload Android test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-privacy-test-failures
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  merge-gate:
    name: Tsuzuri merge gate
    if: always()
    needs: [source-contract, secret-scan, android, android-instrumentation]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every mandatory job succeeded
        env:
          SOURCE: ${{ needs.source-contract.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          ANDROID: ${{ needs.android.result }}
          INSTRUMENTATION: ${{ needs.android-instrumentation.result }}
        run: |
          test "$SOURCE" = 'success'
          test "$SECRETS" = 'success'
          test "$ANDROID" = 'success'
          test "$INSTRUMENTATION" = 'success'
          echo 'All automated Tsuzuri checks passed. External Codex/security review and manual device testing remain separate requirements.'
