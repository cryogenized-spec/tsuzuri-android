name: Tsuzuri CodeQL — Kotlin and Java security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: tsuzuri-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Java/Kotlin analysis
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure CMake and Ninja
        uses: lukka/get-cmake@v4.0.2
      - name: Initialize CodeQL for Kotlin and Java
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compile application for CodeQL extraction
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --stacktrace
      - name: Analyze Kotlin/Java dataflows
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
